# Gemeinschaftsserver (gaming-infra): nur abweichende Werte; fehlende Schlüssel nimmt RankBoard mit Standardwert.
# Ohne Web-Dashboard (rankboard-web.properties) und ohne Zugriffe nach außen (Avatar-Dienst).
default-language=en_us
website-button-enabled=false
join-web-hint-enabled=false
avatar-cache-enabled=false
# Nach oben schauen + Schleichen öffnet sonst das Menü — beim Bauen ständig.
look-up-sneak-menu-enabled=false
# Vanilla-Scoreboard „Tode“ in der Tab-Liste nicht anfassen; Namensfarben nur in den Ranglisten.
foreign-scoreboard-blocking-mode=disabled
scoreboard-name-color-enabled=scoreboard-only
metric-label-food=Gegessen
metric-label-jumps=Sprünge
metric-label-mined=Abgebaut
metric-label-placed=Platziert
metric-label-kills=Kills
metric-label-pvp=PvP-Kills
metric-label-deaths=Tode
metric-label-trades=Handel
metric-label-playtime=Spielzeit
metric-label-elytra=Elytra-Flug
metric-label-fishing=Fische
metric-label-damage=Schaden erlitten
metric-label-dealt=Schaden ausgeteilt
metric-label-dropped=Weggeworfen
metric-label-picked=Aufgesammelt
metric-label-crafted=Hergestellt
metric-label-redstone=Redstone
metric-label-afk=AFK-Zeit
metric-label-bedrock=Grundgestein
metric-label-breeding=Gezüchtet
